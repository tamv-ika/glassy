<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>S2 signaling-less WebRTC</title>
  <script src="common.js"></script>
  <script>
    // Builds the server's SDP answer locally from ConnectInfo (spec §3.5): no signaling round trip.
    function answerSdp(ci, mid, port) {
      return [
        'v=0',
        'o=- 0 0 IN IP4 127.0.0.1',
        's=-',
        't=0 0',
        `a=group:BUNDLE ${mid}`,
        'a=ice-lite',
        `m=application ${port} UDP/DTLS/SCTP webrtc-datachannel`,
        'c=IN IP4 127.0.0.1',
        `a=mid:${mid}`,
        `a=ice-ufrag:${ci.webrtc.ufrag}`,
        `a=ice-pwd:${ci.webrtc.pwd}`,
        `a=fingerprint:sha-256 ${ci.webrtc.dtls_fp}`,
        'a=setup:passive',
        'a=sctp-port:5000',
        'a=max-message-size:262144',
        `a=candidate:1 1 udp 2130706431 127.0.0.1 ${port} typ host`,
        'a=end-of-candidates',
      ].join('\r\n') + '\r\n';
    }

    function opened(dc) {
      return dc.readyState === 'open' ? Promise.resolve() : new Promise((resolve) => (dc.onopen = resolve));
    }

    function echo(dc, text) {
      const reply = new Promise((resolve) => (dc.onmessage = (e) => resolve(e.data)));
      dc.send(text);
      return withTimeout(reply, 10000, `echo on ${dc.label}`);
    }

    // ice-chars only (RFC 8839); 32 chars clears the 22-char minimum for ice-pwd.
    function randomIceString(len) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      const bytes = crypto.getRandomValues(new Uint8Array(len));
      return Array.from(bytes, (b) => alphabet[b % alphabet.length]).join('');
    }

    // The server never sees our offer, so it assumes ice-pwd == ice-ufrag (the libp2p
    // WebRTC-Direct convention) and reads the ufrag from the STUN USERNAME.
    function withDerivablePwd(sdp) {
      const cred = randomIceString(32);
      return sdp.replace(/a=ice-ufrag:\S+/g, `a=ice-ufrag:${cred}`).replace(/a=ice-pwd:\S+/g, `a=ice-pwd:${cred}`);
    }

    window.runS2 = async function runS2(port) {
      const ci = await loadConnectInfo();
      const pc = new RTCPeerConnection();
      const reliable = pc.createDataChannel('r', { negotiated: true, id: 0 });
      const unreliable = pc.createDataChannel('u', { negotiated: true, id: 1, ordered: false, maxRetransmits: 0 });
      const offer = await pc.createOffer();
      await pc.setLocalDescription({ type: 'offer', sdp: withDerivablePwd(offer.sdp) });
      const mid = /a=mid:(\S+)/.exec(pc.localDescription.sdp)[1];
      await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp(ci, mid, port) });
      await withTimeout(Promise.all([opened(reliable), opened(unreliable)]), 10000, 'data channels open');
      const result = {
        ufragLen: ci.webrtc.ufrag.length,
        reliableEcho: await echo(reliable, 'hello-reliable'),
        unreliableEcho: await echo(unreliable, 'hello-unreliable'),
      };
      pc.close();
      return result;
    };
  </script>
</head>
<body>S2</body>
</html>

[package]
name = "cap-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone crate: built on remote hosts by bench/aws without the rest of spikes/.
[workspace]

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.dev]
# Same OOM guards as the spikes/ workspace (CONVENTIONS §3).
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
